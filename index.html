<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>핑크팔레트 · 나만의 그림놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{
    --bg:#FFF3F8; --surface:#ffffff;
    --ink:#4B3A46; --ink-soft:#A08A97;
    --pink:#FF8FB0; --pink-deep:#FF6E9C;
    --shadow:0 12px 32px rgba(255,110,156,.20);
    --shadow-sm:0 4px 14px rgba(200,120,160,.16);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; overscroll-behavior:none;
    font-family:'Pretendard Variable','Pretendard',-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    color:var(--ink); background:var(--bg); user-select:none; -webkit-user-select:none; -webkit-font-smoothing:antialiased; }
  .jua{ font-family:'Jua','Pretendard Variable',sans-serif; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  /* ===== Top bar ===== */
  #topbar{ height:62px; flex:0 0 62px; display:flex; align-items:center; gap:8px; padding:0 14px;
    background:linear-gradient(180deg,#FFE1EE,#FFD3E6); border-bottom:2px solid #FFC0DA; z-index:20; }
  #topbar .title{ font-family:'Jua',sans-serif; color:#B84A79; font-size:21px; flex:1; text-align:center; letter-spacing:-.3px; text-shadow:0 1.5px 0 #fff; }
  .tbtn{ border:none; border-radius:18px; padding:10px 15px; font-size:15px; font-weight:800; cursor:pointer; white-space:nowrap;
    background:linear-gradient(180deg,#ffffff,#FFEFF6); color:var(--pink-deep); box-shadow:0 3px 0 #EFB6CD, var(--shadow-sm); transition:transform .1s; }
  .tbtn:active{ transform:translateY(2px); box-shadow:0 1px 0 #EFB6CD; }
  .tbtn.primary{ background:linear-gradient(180deg,#FF9EC0,#FF6E9C); color:#fff; box-shadow:0 3px 0 #D14E7E, var(--shadow-sm); text-shadow:0 1px 2px rgba(0,0,0,.12); }
  .tbtn.primary:active{ box-shadow:0 1px 0 #D14E7E; }
  .tbtn.hidden{ display:none; }

  /* ===== Home ===== */
  #home{ flex:1; overflow-y:auto; padding:20px 18px 34px; position:relative;
    background:linear-gradient(180deg,#CDEFFF 0%,#E8F7FF 34%,#FFEFF7 72%,#FFE4F0 100%); }
  .deco{ position:absolute; z-index:0; pointer-events:none; }
  .drift{ animation:drift 13s ease-in-out infinite alternate; }
  .drift2{ animation:drift 17s ease-in-out infinite alternate-reverse; }
  @keyframes drift{ from{transform:translateX(-14px)} to{transform:translateX(16px)} }
  .sunspin{ animation:spin 40s linear infinite; transform-origin:center; }
  @keyframes spin{ to{transform:rotate(360deg)} }
  #home .logo{ text-align:center; position:relative; z-index:1; }
  #home .logomark{ width:74px; height:74px; margin:2px auto 4px; display:block; filter:drop-shadow(0 6px 10px rgba(184,74,121,.25)); }
  #home h1{ font-family:'Jua',sans-serif; text-align:center; color:#B84A79; font-size:32px; margin:0; letter-spacing:-.5px; text-shadow:0 2px 0 #fff; }
  #home .sub{ text-align:center; color:#8E6E85; font-size:14px; margin:6px 0 20px; font-weight:600; position:relative; z-index:1; }
  .menu{ display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:520px; margin:0 auto; position:relative; z-index:1; }
  .card{ border:none; border-radius:28px; padding:18px 12px 15px; cursor:pointer;
    background:linear-gradient(180deg,#ffffff,#FFF3F8); border-bottom:5px solid #F3C4D8;
    box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; gap:10px; transition:transform .1s; position:relative; }
  .card:active{ transform:scale(.95); }
  .card .ic{ width:64px; height:64px; border-radius:22px; display:flex; align-items:center; justify-content:center; font-size:34px;
    box-shadow:inset 0 -4px 8px rgba(0,0,0,.08), inset 0 3px 6px rgba(255,255,255,.7); animation:icFloat 3s ease-in-out infinite alternate; }
  .card:nth-child(2n) .ic{ animation-delay:.7s; } .card:nth-child(3n) .ic{ animation-delay:1.3s; }
  @keyframes icFloat{ from{transform:translateY(1px) rotate(-2deg)} to{transform:translateY(-4px) rotate(2deg)} }
  .card .name{ font-family:'Jua',sans-serif; font-size:17.5px; color:#6E4A60; letter-spacing:-.3px; }
  .ic1{ background:linear-gradient(150deg,#FFD9E7,#FFA8C9); } .ic2{ background:linear-gradient(150deg,#E7DFFF,#BCA9FA); }
  .ic3{ background:linear-gradient(150deg,#FFEBC9,#FFC489); } .ic4{ background:linear-gradient(150deg,#D3F8EA,#8FE7CB); }
  .ic5{ background:linear-gradient(150deg,#D8EDFF,#9FD0FF); } .ic6{ background:linear-gradient(150deg,#FFDFD9,#FFA79C); }
  .ic7{ background:linear-gradient(150deg,#FFE2F4,#FF9EDD); }

  /* ===== Screens ===== */
  .screen{ flex:1; display:none; flex-direction:column; overflow:hidden; }
  .screen.active{ display:flex; }
  .stage{ flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:14px;
    background:linear-gradient(180deg,#D9F1FF 0%,#F2FAFF 45%,#FFEFF7 100%); }
  .stage canvas, .stage svg{ touch-action:none; display:block; }
  .board{ position:relative; width:100%; height:100%; max-width:560px; margin:auto; background:#fff; border-radius:30px;
    box-shadow:var(--shadow), 0 0 0 6px rgba(255,255,255,.65); overflow:hidden; }
  .board canvas{ position:absolute; inset:0; width:100%; height:100%; }

  /* toolbars */
  .toolbar{ flex:0 0 auto; background:linear-gradient(180deg,#FFEAF3,#FFDFEC); border-top:2px solid #FFC9DE;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:9px; }
  .row{ display:flex; gap:9px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .swatch{ width:37px; height:37px; border-radius:50%; border:3px solid #fff; box-shadow:0 3px 6px rgba(0,0,0,.16), inset 0 -4px 6px rgba(0,0,0,.12), inset 0 3px 5px rgba(255,255,255,.55); cursor:pointer; transition:transform .1s; }
  .swatch:active{ transform:scale(.9); }
  .swatch.sel{ outline:3.5px solid #fff; box-shadow:0 0 0 6px var(--pink-deep), 0 4px 8px rgba(0,0,0,.2); transform:scale(1.12); }
  .tool{ min-width:54px; height:54px; border:none; border-radius:18px; background:linear-gradient(180deg,#ffffff,#FFF0F6);
    border-bottom:4px solid #EFC3D6; box-shadow:var(--shadow-sm); font-size:22px; cursor:pointer; padding:0 10px; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; transition:transform .1s; }
  .tool:active{ transform:translateY(2px); }
  .tool.sel{ background:linear-gradient(180deg,#FFD5E6,#FFB9D4); border-bottom-color:#E187AC; outline:2.5px solid #fff; box-shadow:0 0 0 5px var(--pink-deep); }
  .tool .lbl{ font-size:11px; font-weight:700; color:#B07A93; }
  .tool.sel .lbl{ color:#8E3A5F; }
  .size-dot{ border-radius:50%; background:var(--pink-deep); }

  .thumbs{ display:flex; gap:9px; overflow-x:auto; padding:3px; scrollbar-width:none; justify-content:center; }
  .thumbs::-webkit-scrollbar{ display:none; }
  .thumb{ flex:0 0 auto; width:62px; height:62px; border-radius:18px; background:#fff; border:3px solid #FFD5E6; cursor:pointer; padding:4px; box-shadow:var(--shadow-sm); transition:transform .1s; overflow:hidden; }
  .thumb:active{ transform:scale(.93); }
  .thumb.sel{ border-color:var(--pink-deep); box-shadow:0 0 0 3px rgba(255,110,156,.25); }
  .thumb svg{ width:100%; height:100%; }

  #fx{ position:fixed; inset:0; pointer-events:none; z-index:50; }
  .spark{ position:absolute; font-size:24px; animation:floatUp 1.1s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes floatUp{ 0%{opacity:1; transform:translateY(0) scale(.5) rotate(0);} 100%{opacity:0; transform:translateY(-130px) scale(1.35) rotate(50deg);} }

  #toast{ position:fixed; left:50%; top:74px; transform:translateX(-50%) translateY(-16px); opacity:0;
    background:rgba(184,74,121,.94); color:#fff; padding:11px 20px; border-radius:22px; font-weight:700; font-size:14px; z-index:60;
    transition:all .25s; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.22); }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .hint{ text-align:center; color:#9A6E88; font-size:12.5px; font-weight:600; }

  /* ===== 살아나는 그림 ===== */
  .alive{ animation:aliveBounce .55s cubic-bezier(.3,1.4,.5,1) 4; transform-origin:50% 85%; }
  g.alive, g.idle{ transform-box:fill-box; transform-origin:50% 85%; }
  @keyframes aliveBounce{ 0%{transform:scale(1) rotate(0)} 25%{transform:scale(1.07,.93) rotate(-2deg)} 50%{transform:scale(.95,1.06) rotate(2deg)} 75%{transform:scale(1.04,.97) rotate(-1deg)} 100%{transform:scale(1)} }
  .idle{ animation:idleBob 2.6s ease-in-out .3s infinite; }
  @keyframes idleBob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  .eyeball{ position:absolute; background:#fff; border:2.5px solid #6b5a66; border-radius:50%; display:flex; align-items:center; justify-content:center;
    animation:eyeBlink 2.8s infinite; z-index:5; pointer-events:none; box-shadow:0 2px 4px rgba(0,0,0,.12); }
  .eyeball .pupil{ width:46%; height:46%; background:#3a2e36; border-radius:50%; animation:lookAround 3.6s infinite; }
  @keyframes eyeBlink{ 0%,88%,100%{transform:scaleY(1)} 94%{transform:scaleY(.08)} }
  @keyframes lookAround{ 0%,20%{transform:translate(0,0)} 35%,50%{transform:translate(28%,10%)} 65%,80%{transform:translate(-28%,10%)} 95%{transform:translate(0,0)} }
  .teye{ transform-box:fill-box; transform-origin:center; animation:eyeBlink 3s infinite; }
  .floaty{ animation:floaty 3.2s ease-in-out infinite alternate; }
  @keyframes floaty{ from{transform:translateY(3px)} to{transform:translateY(-6px)} }

  /* ===== 따라 그리기 ===== */
  .tr-guide{ stroke-linecap:round; stroke-linejoin:round; fill:none; }
  .startDot{ animation:dotPulse 1s infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes dotPulse{ 0%,100%{transform:scale(1);opacity:.95} 50%{transform:scale(1.7);opacity:.45} }

  /* ===== 태블릿 ===== */
  @media (min-width:680px){
    #topbar{ height:72px; flex-basis:72px; } #topbar .title{ font-size:26px; } .tbtn{ font-size:17px; padding:12px 20px; }
    #home{ padding:30px 26px; } #home .logomark{ width:96px; height:96px; } #home h1{ font-size:44px; } #home .sub{ font-size:17px; margin-bottom:28px; }
    .menu{ grid-template-columns:repeat(3,1fr); max-width:840px; gap:20px; }
    .card{ padding:28px 16px 22px; border-radius:34px; } .card .ic{ width:92px; height:92px; font-size:48px; border-radius:30px; } .card .name{ font-size:23px; }
    .board{ max-width:700px; border-radius:36px; }
    .toolbar{ padding:15px 16px calc(15px + env(safe-area-inset-bottom)); gap:12px; }
    .tool{ min-width:70px; height:64px; font-size:26px; border-radius:20px; } .tool .lbl{ font-size:13px; }
    .swatch{ width:48px; height:48px; }
    .thumb{ width:84px; height:84px; border-radius:22px; }
    #mixResult{ width:220px !important; height:220px !important; }
  }
  @media (min-width:1024px){
    .menu{ max-width:980px; } .board{ max-width:780px; }
    .swatch{ width:54px; height:54px; } .tool{ min-width:78px; height:72px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="tbtn" id="musicBtn">🎵</button>
    <button class="tbtn hidden" id="backBtn">← 홈</button>
    <div class="title" id="scrTitle">핑크팔레트</div>
    <button class="tbtn primary hidden" id="saveBtn">저장</button>
  </div>

  <!-- HOME -->
  <div id="home">
    <svg class="deco sunspin" style="top:14px;right:16px;width:84px;height:84px;" viewBox="0 0 100 100">
      <g fill="#FFD54F"><circle cx="50" cy="50" r="22"/>
      <g stroke="#FFD54F" stroke-width="7" stroke-linecap="round">
        <path d="M50 8 v12 M50 80 v12 M8 50 h12 M80 50 h12 M20 20 l9 9 M71 71 l9 9 M80 20 l-9 9 M29 71 l-9 9"/></g></g>
      <circle cx="43" cy="48" r="3" fill="#E8A62E"/><circle cx="57" cy="48" r="3" fill="#E8A62E"/>
      <path d="M44 56 q6 5 12 0" stroke="#E8A62E" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <svg class="deco drift" style="top:44px;left:12px;width:110px;" viewBox="0 0 120 60"><path d="M18 48 C6 48 4 34 16 30 C16 16 36 12 44 22 C52 10 74 14 74 28 C88 24 96 40 84 48 Z" fill="#fff" opacity=".95"/></svg>
    <svg class="deco drift2" style="top:120px;right:4px;width:90px;" viewBox="0 0 120 60"><path d="M18 48 C6 48 4 34 16 30 C16 16 36 12 44 22 C52 10 74 14 74 28 C88 24 96 40 84 48 Z" fill="#fff" opacity=".8"/></svg>
    <div class="logo">
      <img class="logomark floaty" src="fish.png" alt="핑크팔레트 물고기" style="width:132px;height:auto;filter:drop-shadow(0 10px 14px rgba(184,74,121,.28));">
      <h1>핑크팔레트</h1>
    </div>
    <p class="sub">나만의 그림놀이 · 오늘은 무슨 놀이 할까요?</p>
    <div class="menu">
      <button class="card" data-go="trace"><div class="ic ic1">🪄</div><div class="name">따라 그리기</div></button>
      <button class="card" data-go="color"><div class="ic ic7">🖍️</div><div class="name">색칠하기</div></button>
      <button class="card" data-go="draw"><div class="ic ic2">✏️</div><div class="name">자유 그리기</div></button>
      <button class="card" data-go="sticker"><div class="ic ic3">⭐</div><div class="name">스티커 꾸미기</div></button>
      <button class="card" data-go="dress"><div class="ic ic4">👗</div><div class="name">드레스업</div></button>
      <button class="card" data-go="nail"><div class="ic ic5">💅</div><div class="name">네일아트</div></button>
      <button class="card" data-go="mix"><div class="ic ic6">🎨</div><div class="name">색 섞기</div></button>
    </div>
  </div>

  <!-- TRACE -->
  <div class="screen" id="scr-trace">
    <div class="stage"><div class="board" id="traceBoard" style="display:flex;align-items:center;justify-content:center;"></div></div>
    <div class="toolbar">
      <div class="row hint" id="traceHint">반짝이는 점선을 손가락으로 따라 그려요 ✨</div>
      <div class="thumbs" id="traceThumbs"></div>
      <div class="row"><button class="tool" id="traceReset">🔄<span class="lbl">다시</span></button></div>
    </div>
  </div>

  <!-- COLOR -->
  <div class="screen" id="scr-color">
    <div class="stage"><div class="board" id="colorBoard"><canvas id="colorCanvas"></canvas></div></div>
    <div class="toolbar">
      <div class="row" id="colorModes"></div>
      <div class="thumbs" id="colorThumbs"></div>
      <div class="row" id="colorPalette"></div>
    </div>
  </div>

  <!-- DRAW -->
  <div class="screen" id="scr-draw">
    <div class="stage"><div class="board"><canvas id="drawCanvas"></canvas></div></div>
    <div class="toolbar">
      <div class="row" id="drawTools"></div>
      <div class="row" id="drawPalette"></div>
      <div class="row" id="drawSizes"></div>
    </div>
  </div>

  <!-- STICKER -->
  <div class="screen" id="scr-sticker">
    <div class="stage"><div class="board"><canvas id="stickerCanvas"></canvas></div></div>
    <div class="toolbar">
      <div class="row hint">스티커를 눌러 추가하고, 손으로 끌어 옮겨요 · 두 번 누르면 커져요</div>
      <div class="row" id="stickerBg"></div>
      <div class="row" id="stickerList"></div>
      <div class="row"><button class="tool" id="stickerUndo">↩️<span class="lbl">되돌리기</span></button><button class="tool" id="stickerClear">🗑️<span class="lbl">비우기</span></button></div>
    </div>
  </div>

  <!-- DRESS -->
  <div class="screen" id="scr-dress">
    <div class="stage"><div class="board" id="dressStage" style="display:flex;align-items:center;justify-content:center;"></div></div>
    <div class="toolbar">
      <div class="row" id="dressParts"></div>
      <div class="row" id="dressPalette"></div>
    </div>
  </div>

  <!-- NAIL -->
  <div class="screen" id="scr-nail">
    <div class="stage"><div class="board" id="nailStage" style="display:flex;align-items:center;justify-content:center;"></div></div>
    <div class="toolbar">
      <div class="row hint">손톱을 먼저 누르고, 모양·색·보석을 골라요 ✨</div>
      <div class="row" id="nailShapes"></div>
      <div class="row" id="nailPalette"></div>
      <div class="row" id="nailGems"></div>
    </div>
  </div>

  <!-- MIX -->
  <div class="screen" id="scr-mix">
    <div class="stage" style="flex-direction:column;gap:18px;">
      <div id="mixResult" style="width:160px;height:160px;border-radius:46px;background:#fff;box-shadow:var(--shadow);transition:background .3s;border:6px solid #fff;"></div>
      <div id="mixLabel" class="jua" style="color:#B84A79;font-size:18px;text-shadow:0 1px 0 #fff;">두 가지 색을 섞어봐요!</div>
    </div>
    <div class="toolbar">
      <div class="row hint">아래 물감을 눌러 섞으면 새로운 색이 만들어져요</div>
      <div class="row" id="mixPalette"></div>
      <div class="row"><button class="tool" id="mixReset">🔄<span class="lbl">다시</span></button></div>
    </div>
  </div>
</div>
<div id="fx"></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const el=(t,c)=>{const e=document.createElement(t); if(c)e.className=c; return e;};
const DPR=()=>Math.min(window.devicePixelRatio||1,2);
function hexToRgb(h){ h=h.replace('#',''); if(h.length===3)h=h.split('').map(x=>x+x).join(''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function shade(hex,p){ const c=hexToRgb(hex).map(v=>Math.max(0,Math.min(255,Math.round(v+255*p)))); return 'rgb('+c.join(',')+')'; }

/* ---------- Sound ---------- */
let AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function beep(freq=600,dur=0.08,type='sine',vol=0.12){ try{ const A=ac();
  const o=A.createOscillator(),g=A.createGain(); o.type=type; o.frequency.value=freq; o.connect(g); g.connect(A.destination);
  g.gain.setValueAtTime(vol,A.currentTime); g.gain.exponentialRampToValueAtTime(0.001,A.currentTime+dur); o.start(); o.stop(A.currentTime+dur);}catch(e){} }
function chime(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'triangle',0.16),i*90)); }
function speak(text){ try{ if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=0.92; u.pitch=1.25; u.volume=1;
  const vs=speechSynthesis.getVoices(); const ko=vs.find(v=>v.lang&&v.lang.startsWith('ko')); if(ko)u.voice=ko;
  speechSynthesis.speak(u); }catch(e){} }
if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }

/* ---------- 배경음악 (은은한 오르골풍 생성 멜로디) ---------- */
let musicOn=false, musicTimer=null, mIdx=2;
const MSCALE=[523.25,587.33,659.25,783.99,880.0,1046.5];
function musicTick(){ if(!musicOn)return;
  mIdx+=[-2,-1,-1,0,1,1,2][(Math.random()*7)|0]; mIdx=Math.max(0,Math.min(MSCALE.length-1,mIdx));
  beep(MSCALE[mIdx],0.5,'triangle',0.045);
  if(Math.random()<0.3) beep(MSCALE[mIdx]/2,0.7,'sine',0.03);
  musicTimer=setTimeout(musicTick,340+Math.random()*380);
}
$('#musicBtn').onclick=()=>{ musicOn=!musicOn; $('#musicBtn').textContent=musicOn?'🔊':'🎵';
  if(musicOn){ try{ ac().resume(); }catch(e){} musicTick(); toast('배경음악을 켰어요 🎶'); } else { clearTimeout(musicTimer); } };

/* ---------- FX ---------- */
function sparkle(x,y,n=10){ const m=['✨','⭐','💖','🌟','💫','🎉'];
  for(let i=0;i<n;i++){ const s=el('div','spark'); s.textContent=m[(Math.random()*m.length)|0];
    s.style.left=(x+(Math.random()*80-40))+'px'; s.style.top=(y+(Math.random()*40-20))+'px'; $('#fx').appendChild(s); setTimeout(()=>s.remove(),1100);} }
function celebrate(){ chime(); const w=innerWidth; for(let i=0;i<5;i++) setTimeout(()=>sparkle(Math.random()*w,innerHeight*0.4,8),i*120); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }

/* ---------- 팔레트 ---------- */
const COLORS=['#FF6E9C','#FF9EC0','#FF6F61','#FFB067','#FFDA6B','#8CE0A6','#5FD3B2','#7FC4FF','#8CA0FF','#B79BFF','#FF9BE0','#B98A6E','#5B4A55','#FFFFFF'];

/* ---------- 화면 전환 ---------- */
const TITLES={home:'핑크팔레트',trace:'따라 그리기',color:'색칠하기',draw:'자유 그리기',sticker:'스티커 꾸미기',dress:'드레스업',nail:'네일아트',mix:'색 섞기'};
let current='home';
function show(name){ current=name;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('#home').style.display=name==='home'?'block':'none';
  if(name!=='home') $('#scr-'+name).classList.add('active');
  $('#scrTitle').textContent=TITLES[name]||'핑크팔레트';
  $('#backBtn').classList.toggle('hidden',name==='home');
  $('#saveBtn').classList.toggle('hidden',name==='home'||name==='mix');
  beep(700,0.06,'sine',0.09);
  requestAnimationFrame(()=>{
    if(name==='trace')initTrace(); if(name==='color')initColor(); if(name==='draw')initDraw(); if(name==='sticker')initSticker();
    if(name==='dress')initDress(); if(name==='nail')initNail(); if(name==='mix')initMix();
  });
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
$('#backBtn').onclick=()=>show('home');

/* ---------- 저장 ---------- */
function download(u,n){ const a=el('a'); a.href=u; a.download=n; document.body.appendChild(a); a.click(); a.remove(); }
function svgToPng(svg,name){ const clone=svg.cloneNode(true); const vb=svg.viewBox.baseVal;
  const w=vb&&vb.width?vb.width:svg.clientWidth, h=vb&&vb.height?vb.height:svg.clientHeight;
  clone.setAttribute('width',w*2); clone.setAttribute('height',h*2);
  const xml=new XMLSerializer().serializeToString(clone);
  const url='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(xml)));
  const img=new Image(); img.onload=()=>{ const c=el('canvas'); c.width=w*2; c.height=h*2; const ctx=c.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height); download(c.toDataURL('image/png'),name); }; img.src=url; }
$('#saveBtn').onclick=()=>{ const t=Date.now();
  if(current==='trace'){ const s=$('#traceBoard svg'); if(s) svgToPng(s,'따라그리기_'+t+'.png'); }
  else if(current==='color') download($('#colorCanvas').toDataURL('image/png'),'색칠_'+t+'.png');
  else if(current==='draw') download($('#drawCanvas').toDataURL('image/png'),'그림_'+t+'.png');
  else if(current==='sticker') download($('#stickerCanvas').toDataURL('image/png'),'스티커_'+t+'.png');
  else if(current==='dress'){ const s=$('#dressStage svg'); if(s) svgToPng(s,'드레스업_'+t+'.png'); }
  else if(current==='nail'){ const s=$('#nailStage svg'); if(s) svgToPng(s,'네일_'+t+'.png'); }
  celebrate(); toast('그림을 저장했어요 🎉'); };

let trInit=false, trChar=null, trStep=0, trPts=null, trHitArr=null, trN=0, trL=0, trSolidEl=null, trGuideEl=null, trDotEl=null, trDone=false;
function traceBaseSVG(name,uid){ const ch=TRACE[name];
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" style="max-width:100%;max-height:100%;">`;
  s+=ch.scene(uid);
  s+='<g id="trCharG">';
  ch.steps.forEach((st,i)=>{
    s+=`<path class="tr-solid" id="ts${i}" d="${st.d}" stroke="${st.c}" stroke-width="${st.w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  s+='</g>';
  ch.steps.forEach((st,i)=>{
    s+=`<path class="tr-guide" id="tg${i}" d="${st.d}" stroke="#ffffff" stroke-opacity=".9" stroke-width="${Math.max(st.w-2,5)}" stroke-dasharray="6 11" style="display:none"/>`;
  });
  s+='<circle class="startDot" id="trDot" r="10" fill="#FF6E9C" stroke="#fff" stroke-width="3" style="display:none"/>';
  s+='</svg>'; return s; }
function traceFaceSVG(name){ const f=TRACE[name].face; let s='<g class="tr-face">';
  (f.eyes||[]).forEach(e=>{ s+=`<g class="teye"><circle cx="${e[0]}" cy="${e[1]}" r="${e[2]+2}" fill="#fff"/><circle cx="${e[0]}" cy="${e[1]}" r="${e[2]}" fill="#4B3A46"/><circle cx="${e[0]+e[2]*.35}" cy="${e[1]-e[2]*.35}" r="${e[2]*.34}" fill="#fff"/><circle cx="${e[0]-e[2]*.3}" cy="${e[1]+e[2]*.3}" r="${e[2]*.18}" fill="#fff" opacity=".8"/></g>`; });
  (f.blush||[]).forEach(b=>{ s+=`<circle cx="${b[0]}" cy="${b[1]}" r="${b[2]}" fill="#FFB3C6" opacity=".7"/>`; });
  if(f.mouth) s+=`<path d="${f.mouth}" stroke="#D14A6E" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  if(f.extra) s+=f.extra;
  s+='</g>'; return s; }
function traceThumbSVG(name,uid){ const ch=TRACE[name]; let s=`<svg viewBox="0 0 300 300">`+ch.scene(uid);
  ch.steps.forEach(st=>{ s+=`<path d="${st.d}" stroke="${st.c}" stroke-width="${st.w}" fill="${st.fill||'none'}" stroke-linecap="round" stroke-linejoin="round"/>`; });
  s+=traceFaceSVG(name)+'</svg>'; return s; }
function initTrace(){
  if(!trInit){ trInit=true;
    const thumbs=$('#traceThumbs');
    Object.keys(TRACE).forEach((name,i)=>{ const t=el('div','thumb'+(i===0?' sel':'')); t.innerHTML=traceThumbSVG(name,'t'+i);
      t.onclick=()=>{ loadTrace(name); thumbs.querySelectorAll('.thumb').forEach(x=>x.classList.remove('sel')); t.classList.add('sel'); }; thumbs.appendChild(t); });
    $('#traceReset').onclick=()=>{ if(trChar) loadTrace(trChar); beep(320); };
    bindTrace();
  }
  loadTrace(trChar||Object.keys(TRACE)[0]);
}
function loadTrace(name){ trChar=name; trStep=0; trDone=false;
  const board=$('#traceBoard'); board.innerHTML=traceBaseSVG(name,'b');
  TRACE[name].steps.forEach((st,i)=>{ const ts=board.querySelector('#ts'+i); const L=ts.getTotalLength();
    ts.style.strokeDasharray=L; ts.style.strokeDashoffset=L; });
  startTraceStep();
}
function startTraceStep(){ const board=$('#traceBoard'); const ch=TRACE[trChar];
  if(trStep>=ch.steps.length){ finishTrace(); return; }
  $('#traceHint').textContent=(trStep+1)+' / '+ch.steps.length+' 단계 · 반짝이는 점선을 따라 그려요 ✨';
  trGuideEl=board.querySelector('#tg'+trStep); trSolidEl=board.querySelector('#ts'+trStep); trDotEl=board.querySelector('#trDot');
  trGuideEl.style.display='';
  trL=trSolidEl.getTotalLength();
  trN=Math.max(14,Math.round(trL/13)); trPts=[]; trHitArr=new Uint8Array(trN);
  for(let i=0;i<trN;i++){ const p=trSolidEl.getPointAtLength(trL*i/(trN-1)); trPts.push([p.x,p.y]); }
  const s0=trPts[0]; trDotEl.setAttribute('cx',s0[0]); trDotEl.setAttribute('cy',s0[1]); trDotEl.style.display='';
}
function traceProgress(x,y){ if(trDone||!trPts)return; const R=24; let hitNew=false;
  for(let i=0;i<trN;i++){ if(!trHitArr[i]){ const dx=trPts[i][0]-x, dy=trPts[i][1]-y; if(dx*dx+dy*dy<R*R){ trHitArr[i]=1; hitNew=true; } } }
  if(!hitNew)return;
  let hits=0; for(let i=0;i<trN;i++) hits+=trHitArr[i];
  const ratio=hits/trN;
  trSolidEl.style.strokeDashoffset=trL*(1-ratio);
  if(ratio>=0.7) completeTraceStep();
}
function completeTraceStep(){ const st=TRACE[trChar].steps[trStep];
  trSolidEl.style.transition='stroke-dashoffset .3s ease'; trSolidEl.style.strokeDashoffset=0;
  const solid=trSolidEl;
  setTimeout(()=>{ solid.style.transition=''; if(st.fill) solid.setAttribute('fill',st.fill); },320);
  trGuideEl.style.display='none'; trDotEl.style.display='none';
  const end=trPts[trN-1]; const svg=$('#traceBoard svg'); if(svg){ const r=svg.getBoundingClientRect(); sparkle(r.left+end[0]/300*r.width, r.top+end[1]/300*r.height, 6); }
  beep(880,0.12,'triangle',0.16);
  trStep++; trPts=null;
  setTimeout(startTraceStep,380);
}
function finishTrace(){ trDone=true; $('#traceHint').textContent='우와, 완성! 그림이 살아났어요! 🎉';
  const svg=$('#traceBoard svg'); if(!svg)return;
  const g=svg.querySelector('#trCharG'); if(g){ g.insertAdjacentHTML('beforeend',traceFaceSVG(trChar));
    g.classList.add('alive'); setTimeout(()=>{ g.classList.remove('alive'); g.classList.add('idle'); },2300); }
  celebrate();
}
function bindTrace(){ const board=$('#traceBoard'); let tracing=false;
  const pos=e=>{ const svg=board.querySelector('svg'); if(!svg)return null; const r=svg.getBoundingClientRect(); const p=e.touches?e.touches[0]:e;
    return {x:(p.clientX-r.left)*300/r.width, y:(p.clientY-r.top)*300/r.height}; };
  board.addEventListener('pointerdown',e=>{ e.preventDefault(); tracing=true; const p=pos(e); if(p) traceProgress(p.x,p.y); });
  board.addEventListener('pointermove',e=>{ if(!tracing)return; e.preventDefault(); const p=pos(e); if(p) traceProgress(p.x,p.y); });
  window.addEventListener('pointerup',()=>tracing=false);
}

const SP_IMG={};
function initSticker(){ sCanvas=$('#stickerCanvas'); sCtx=fitCanvas(sCanvas); sCtx.setTransform(1,0,0,1,0,0);
  if(!sInit){ sInit=true;
    Object.keys(SPECIALS).forEach(k=>{ rasterize(SPECIALS[k],240,240).then(c=>{ SP_IMG[k]=c; }); });
    const bg=$('#stickerBg'); BGS.forEach((b,i)=>{ const s=el('div','swatch'+(i===0?' sel':'')); s.style.background='linear-gradient(180deg,'+b[0]+','+b[1]+')';
      s.onclick=()=>{bgSel=i;bg.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel'));s.classList.add('sel');redrawStk();beep(500);}; bg.appendChild(s);});
    const list=$('#stickerList');
    Object.keys(SPECIALS).forEach(k=>{ const b=el('button','tool'); b.innerHTML=SPECIALS[k]; b.querySelector('svg').style.cssText='width:34px;height:34px;';
      b.onclick=()=>{ stickers.push({sp:k,x:sCanvas.width/2+(Math.random()*120-60),y:sCanvas.height/2+(Math.random()*120-60),size:110*DPR()}); redrawStk(); sparkle(innerWidth/2,innerHeight/2,4); beep(680);}; list.appendChild(b);});
    STICKERS.forEach(em=>{ const b=el('button','tool'); b.textContent=em; b.style.fontSize='24px';
      b.onclick=()=>{ stickers.push({em,x:sCanvas.width/2+(Math.random()*120-60),y:sCanvas.height/2+(Math.random()*120-60),size:64*DPR()}); redrawStk(); sparkle(innerWidth/2,innerHeight/2,4); beep(680);}; list.appendChild(b);});
    $('#stickerUndo').onclick=()=>{stickers.pop();redrawStk();beep(400);};
    $('#stickerClear').onclick=()=>{stickers=[];redrawStk();beep(300);};
    const anim=el('button','tool'); anim.id='stkAnimBtn'; anim.innerHTML='🪄<span class="lbl">움직이기</span>';
    anim.onclick=()=>{ stkAnim=!stkAnim; anim.classList.toggle('sel',stkAnim); beep(650); if(stkAnim) stkLoop(); else redrawStk(); };
    $('#stickerUndo').parentElement.appendChild(anim);
    bindSticker();
  }
  redrawStk(); if(stkAnim) stkLoop();
}
function stkLoop(){ if(!stkAnim||current!=='sticker')return; redrawStk(performance.now()); requestAnimationFrame(stkLoop); }
function redrawStk(t){ if(!sCtx)return; sCtx.setTransform(1,0,0,1,0,0);
  const g=sCtx.createLinearGradient(0,0,0,sCanvas.height); g.addColorStop(0,BGS[bgSel][0]); g.addColorStop(1,BGS[bgSel][1]);
  sCtx.fillStyle=g; sCtx.fillRect(0,0,sCanvas.width,sCanvas.height);
  sCtx.textAlign='center'; sCtx.textBaseline='middle';
  stickers.forEach((s,i)=>{
    let dx=0,dy=0,rot=0,sc=1;
    if(t){ const type=i%3;
      if(type===0) dy=Math.sin(t/350+i*1.3)*7*DPR();
      else if(type===1) rot=Math.sin(t/480+i)*0.22;
      else sc=1+0.1*Math.sin(t/300+i*0.9); }
    sCtx.save(); sCtx.translate(s.x+dx,s.y+dy); sCtx.rotate(rot); sCtx.scale(sc,sc);
    if(s.sp){ const img=SP_IMG[s.sp]; if(img){ const w=s.size*1.5; sCtx.drawImage(img,-w/2,-w/2,w,w); } }
    else { sCtx.font=s.size+'px serif'; sCtx.fillText(s.em,0,0); }
    sCtx.restore();
  }); }
function bindSticker(){ let drag=null,off={x:0,y:0},lastTap=0,lastIdx=-1;
  const pos=e=>{ const r=sCanvas.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:(p.clientX-r.left)*(sCanvas.width/r.width),y:(p.clientY-r.top)*(sCanvas.height/r.height)}; };
  const hit=p=>{ for(let i=stickers.length-1;i>=0;i--){ const s=stickers[i]; if(Math.abs(p.x-s.x)<s.size/1.6&&Math.abs(p.y-s.y)<s.size/1.6)return i;} return -1; };
  sCanvas.addEventListener('pointerdown',e=>{ e.preventDefault(); const p=pos(e); const i=hit(p);
    if(i>=0){ const now=Date.now(); if(now-lastTap<350&&lastIdx===i){ stickers[i].size=Math.min(stickers[i].size+22*DPR(),160*DPR()); redrawStk(); beep(720);} lastTap=now; lastIdx=i;
      off={x:p.x-stickers[i].x,y:p.y-stickers[i].y}; stickers.push(stickers.splice(i,1)[0]); drag=stickers.length-1; redrawStk(); } });
  sCanvas.addEventListener('pointermove',e=>{ if(drag===null)return; e.preventDefault(); const p=pos(e); stickers[drag].x=p.x-off.x; stickers[drag].y=p.y-off.y; redrawStk(); });
  window.addEventListener('pointerup',()=>drag=null);
}

function nailPathD(shape,x,y,rx,ry){
  if(shape==='square') return `M ${x-rx} ${y-ry+3} Q ${x-rx} ${y-ry} ${x-rx+3} ${y-ry} L ${x+rx-3} ${y-ry} Q ${x+rx} ${y-ry} ${x+rx} ${y-ry+3} L ${x+rx} ${y+ry-6} Q ${x} ${y+ry+2} ${x-rx} ${y+ry-6} Z`;
  if(shape==='almond') return `M ${x} ${y-ry*1.35} C ${x+rx*0.95} ${y-ry*0.45} ${x+rx} ${y+ry*0.3} ${x} ${y+ry} C ${x-rx} ${y+ry*0.3} ${x-rx*0.95} ${y-ry*0.45} ${x} ${y-ry*1.35} Z`;
  if(shape==='point') return `M ${x} ${y-ry*1.5} L ${x+rx*0.88} ${y+ry*0.15} C ${x+rx*0.55} ${y+ry} ${x-rx*0.55} ${y+ry} ${x-rx*0.88} ${y+ry*0.15} Z`;
  return `M ${x-rx} ${y} A ${rx} ${ry} 0 1 1 ${x+rx} ${y} A ${rx} ${ry} 0 1 1 ${x-rx} ${y} Z`;
}

      <path d="M128 166 q7 4 14 0" transform="rotate(3 135 220)"/>
      <path d="M161 156 q7 4 14 0"/>
      <path d="M193 170 q7 4 14 0" transform="rotate(-3.5 199 222)"/></g>`;
  // 손등 하이라이트
  s+=`<ellipse cx="160" cy="250" rx="44" ry="30" fill="#fff" opacity=".14"/>`;
  // 반지 (약지)
  s+=`<g transform="rotate(3 135 220)"><rect x="124" y="150" width="24" height="6.5" rx="3.2" fill="#FFD54F" stroke="#DBA928" stroke-width="1.6"/><circle cx="136" cy="146" r="3.6" fill="#FF9EC0" stroke="#E85D8A" stroke-width="1.4"/></g>`;
  // 소매 (조개 주름 커프스)
  s+=`<rect x="118" y="328" width="84" height="24" rx="6" fill="#FF9EC0" stroke="#E85D8A" stroke-width="3.5"/>
      <path d="M118 330 a14 12 0 0 1 28 0 a14 12 0 0 1 28 0 a14 12 0 0 1 28 0" fill="#FF9EC0" stroke="#E85D8A" stroke-width="3.5"/>
      <circle cx="140" cy="342" r="2.8" fill="#fff" opacity=".85"/><circle cx="160" cy="344" r="2.8" fill="#fff" opacity=".85"/><circle cx="180" cy="342" r="2.8" fill="#fff" opacity=".85"/>`;
  // 손톱 (선택한 모양으로)
  nails.forEach((n,i)=>{
    const g=n.rot?`<g transform="${n.rot}">`:''; const ge=n.rot?'</g>':'';
    s+=g+`<path class="nail" data-i="${i}" d="${nailPathD(nailShape,n.x,n.y,n.rx,n.ry)}" fill="${nailColors[i]}" stroke="${i===nailSel?'#FF6E9C':'#E9BFA5'}" stroke-width="${i===nailSel?3.5:2.2}" stroke-linejoin="round"/>`;
    if(nailColors[i]!=='#ffffff') s+=`<ellipse cx="${n.x-3.2}" cy="${n.y-4.5}" rx="2.8" ry="4.5" fill="rgba(255,255,255,.6)" style="pointer-events:none"/>`;
    if(nailGem[i]) s+=`<text x="${n.x}" y="${n.y+5}" font-size="14" text-anchor="middle" style="pointer-events:none">${nailGem[i]}</text>`;
    s+=ge;
  });
  return s+`</svg>`;
}
function renderNail(){ const stage=$('#nailStage'); stage.innerHTML=nailSVG();
  stage.querySelectorAll('.nail').forEach(n=>n.addEventListener('click',()=>{ nailSel=+n.dataset.i; renderNail(); beep(620);})); }
function initNail(){ renderNail(); if(nailInit)return; nailInit=true;
  const shapes=[['round','⚪','둥근'],['almond','🌰','아몬드'],['square','⬜','사각'],['point','🔻','뾰족']];
  const sc=$('#nailShapes'); shapes.forEach((sh,i)=>{ const b=el('button','tool'+(i===0?' sel':'')); b.innerHTML=sh[1]+'<span class="lbl">'+sh[2]+'</span>';
    b.onclick=()=>{nailShape=sh[0];sc.querySelectorAll('.tool').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');renderNail();beep(640);}; sc.appendChild(b);});
  const pal=$('#nailPalette'); COLORS.forEach(c=>{ const s=el('div','swatch'); s.style.background=c;
    s.onclick=()=>{nailColors[nailSel]=c;renderNail();sparkle(innerWidth/2,innerHeight/2,3);beep(680);}; pal.appendChild(s);});
  const gems=$('#nailGems'); ['💎','⭐','💖','🌸','✨','❌'].forEach(g=>{ const b=el('button','tool'); b.textContent=g; b.style.fontSize='20px';
    b.onclick=()=>{nailGem[nailSel]=(g==='❌'?null:g);renderNail();beep(700);}; gems.appendChild(b);}); }

let mixInit=false,mixA=null,mixB=null;
// 물감 10색 (인덱스: 0빨강 1주황 2노랑 3초록 4파랑 5보라 6분홍 7갈색 8흰색 9검정)
const MIX=[['빨강',[235,60,60]],['주황',[255,150,40]],['노랑',[255,215,70]],['초록',[90,190,90]],['파랑',[70,130,235]],
           ['보라',[150,90,200]],['분홍',[255,150,190]],['갈색',[150,100,60]],['흰색',[250,250,250]],['검정',[55,50,55]]];
// 물감처럼 진짜 섞이는 결과표 (혼합색 이름 + 색상)
const PAIRMIX={
 '0-1':['다홍색',[255,105,50]], '0-2':['주황',[255,150,40]], '0-3':['갈색',[150,100,60]], '0-4':['보라',[140,80,200]],
 '0-5':['자주색',[170,60,150]], '0-6':['진분홍',[255,90,150]], '0-7':['팥색',[140,70,55]], '0-8':['분홍',[255,150,190]], '0-9':['밤색',[110,45,45]],
 '1-2':['귤색',[255,190,50]], '1-3':['황토색',[200,150,50]], '1-4':['갈색',[160,110,70]], '1-5':['벽돌색',[180,90,90]],
 '1-6':['산호색',[255,140,120]], '1-7':['황토색',[190,130,60]], '1-8':['살구색',[255,200,160]], '1-9':['갈색',[130,85,40]],
 '2-3':['연두색',[170,220,80]], '2-4':['초록',[80,180,90]], '2-5':['갈색',[150,110,80]], '2-6':['살구색',[255,190,150]],
 '2-7':['황토색',[200,160,70]], '2-8':['연노랑',[255,240,170]], '2-9':['카키색',[130,120,60]],
 '3-4':['청록색',[60,170,170]], '3-5':['회녹색',[120,130,120]], '3-6':['연갈색',[180,150,120]], '3-7':['국방색',[110,110,50]],
 '3-8':['연두색',[180,230,140]], '3-9':['진초록',[40,110,60]],
 '4-5':['남보라',[100,90,220]], '4-6':['연보라',[190,140,220]], '4-7':['고동색',[100,80,70]], '4-8':['하늘색',[150,200,255]], '4-9':['남색',[35,50,110]],
 '5-6':['연자주',[210,120,190]], '5-7':['고동색',[120,80,90]], '5-8':['연보라',[200,170,230]], '5-9':['진보라',[80,50,120]],
 '6-7':['연갈색',[200,140,120]], '6-8':['연분홍',[255,205,225]], '6-9':['자주색',[150,70,110]],
 '7-8':['베이지색',[220,190,160]], '7-9':['고동색',[90,60,40]],
 '8-9':['회색',[150,150,150]]
};
function initMix(){ if(mixInit)return; mixInit=true; const pal=$('#mixPalette');
  MIX.forEach((m,i)=>{ const s=el('div','swatch'); s.style.background='rgb('+m[1].join(',')+')'; s.title=m[0];
    s.onclick=()=>{ addMix(m,i); beep(600);}; pal.appendChild(s);});
  $('#mixReset').onclick=()=>{mixA=mixB=null;$('#mixResult').style.background='#fff';$('#mixLabel').textContent='두 가지 색을 섞어봐요!';beep(300);}; }
function addMix(m,idx){
  if(!mixA){ mixA={m,idx}; $('#mixResult').style.background='rgb('+m[1].join(',')+')'; $('#mixLabel').textContent=m[0]+' + ?'; }
  else if(!mixB){ mixB={m,idx};
    let name,rgb;
    if(mixA.idx===idx){ name=m[0]; rgb=m[1]; }
    else{ const key=Math.min(mixA.idx,idx)+'-'+Math.max(mixA.idx,idx); const hit=PAIRMIX[key];
      if(hit){ name=hit[0]; rgb=hit[1]; }
      else{ rgb=[0,1,2].map(i=>Math.round((mixA.m[1][i]+m[1][i])/2)); name='새로운 색'; } }
    $('#mixResult').style.background='rgb('+rgb.join(',')+')';
    $('#mixLabel').textContent=mixA.m[0]+' + '+m[0]+' = '+name+'!';
    sparkle(innerWidth/2,innerHeight*0.35,6); chime();
    setTimeout(()=>speak(name+'!'),350); }
  else { mixA={m,idx}; mixB=null; $('#mixResult').style.background='rgb('+m[1].join(',')+')'; $('#mixLabel').textContent=m[0]+' + ?'; } }

  if(current==='sticker'&&sCanvas){sCtx=fitCanvas(sCanvas);redrawStk();}
  if(current==='color'&&colorPage){loadPage(colorPage);}
},200); });
